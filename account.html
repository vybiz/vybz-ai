<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VYBZ AI — Account</title>
<style>
:root{--bg:#0b0b10;--card:#16161f;--line:#2a2a3a;--tx:#f2f0fa;--mut:#9a98b0;--v:#8b5cf6;--b:#38bdf8;--bad:#f87171;--ok:#4ade80;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
.tag{background:linear-gradient(90deg,var(--v),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
input{width:100%;font:inherit;background:#0e0e16;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:#262636;color:var(--tx);min-height:44px}
button.p{background:linear-gradient(135deg,var(--v),#6d28d9);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}.item div{flex:1;min-width:0}small{color:var(--mut)}
#msg{margin-top:8px;font-size:14px;color:#fbbf24}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0f0f17;border-top:1px solid #2a2a3a;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav a{flex:1;text-align:center;padding:14px 4px;color:#9a98b0;text-decoration:none;font-size:13px}nav a.on{color:#a78bfa;font-weight:700}
main{padding-bottom:96px!important}
select{font:inherit;background:#262636;color:#f2f0fa;border:0;border-radius:12px;padding:12px;width:100%;margin-top:4px}
</style></head><body><main>
<h1><span class="tag">VYBZ AI</span> Account</h1>
<div id="msg"></div>

<div class="card" id="auth">
  <h2>Sign up or log in</h2>
  <input id="email" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Password (8+ characters)" autocomplete="current-password">
  <div class="row"><button class="p" id="login">Log in</button><button id="signup">Create account</button></div>
  <small>Check your inbox to confirm your email after signing up.</small>
</div>

<div id="app" hidden>
  <div class="card"><small id="who"></small><div class="row"><button id="logout">Log out</button></div></div>
  <div class="card"><h2>On this device</h2><div id="local"></div>
    <small>Recordings made in Voice Studio. Upload to keep them in your private cloud storage.</small></div>
  <div class="card"><h2>My cloud recordings</h2><div id="cloud"></div></div>
</div>
</main>
<script src="nav.js"></script>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ====== PASTE YOUR VALUES (Supabase → Settings → API Keys). Use the anon/publishable key ONLY. ======
// ===================================================================================================
const $=id=>document.getElementById(id);
const say=m=>$('msg').textContent=m||'';
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
if(SUPABASE_URL.startsWith('PASTE')){say('Add your Supabase URL and anon key in config.js first.');}
const sb=window.supabase&&!SUPABASE_URL.startsWith('PASTE')?window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
let user=null;

$('signup').onclick=async()=>{
  if(!sb)return;say('');
  const {error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('pw').value});
  say(error?error.message:'Account created. Confirm via the email we sent, then log in.');
};
$('login').onclick=async()=>{
  if(!sb)return;say('');
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});
  if(error)say(error.message);
};
$('logout').onclick=()=>sb&&sb.auth.signOut();
if(sb)sb.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;$('auth').hidden=!!user;$('app').hidden=!user;
  if(user){$('who').textContent='Signed in as '+user.email;refresh();}});
if(sb)sb.auth.getSession().then(({data})=>{if(data.session){user=data.session.user;$('auth').hidden=true;$('app').hidden=false;$('who').textContent='Signed in as '+user.email;refresh();}});

const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('vybz',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function localAll(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('rec','readonly').objectStore('rec').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}

function row(box,title,sub,btns){
  const el=document.createElement('div');el.className='item';
  const d=document.createElement('div');const b=document.createElement('b');b.textContent=title;
  const s=document.createElement('small');s.textContent=sub;d.append(b,document.createElement('br'),s);el.append(d);
  for(const [t,f] of btns){const x=document.createElement('button');x.textContent=t;x.onclick=f;el.append(x);}
  box.append(el);
}
async function refresh(){
  const L=$('local'),C=$('cloud');L.textContent='';C.textContent='';
  let loc=[];try{loc=await localAll();}catch(e){}
  const {data:cl,error}=await sb.from('voice_recordings').select('*').order('created_at',{ascending:false});
  if(error)say('Could not load cloud list: '+error.message);
  const have=new Set((cl||[]).map(r=>r.storage_path));
  const pending=loc.filter(r=>!have.has(user.id+'/'+r.id+ext(r.blob)));
  if(!pending.length)L.innerHTML='<small>Nothing waiting to upload.</small>';
  for(const r of pending)row(L,(r.kind==='singing'?'Singing ':'Speaking ')+fmt(r.m.dur),'Quality '+r.m.score,[['Upload',()=>up(r)]]);
  if(!(cl||[]).length)C.innerHTML='<small>No cloud recordings yet.</small>';
  for(const r of cl||[])row(C,(r.kind==='singing'?'Singing ':'Speaking ')+fmt(r.duration_s),'Quality '+r.quality_score+' · '+new Date(r.created_at).toLocaleDateString(),
    [['Play',()=>play(r)],['Delete',()=>del(r)]]);
}
const ext=b=>b.type.includes('mp4')?'.m4a':'.webm';
async function up(r){
  say('Uploading…');const path=user.id+'/'+r.id+ext(r.blob);
  const u=await sb.storage.from('recordings').upload(path,r.blob,{contentType:r.blob.type||'audio/webm',upsert:false});
  if(u.error){say('Upload failed: '+u.error.message);return;}
  const m=r.m,ins=await sb.from('voice_recordings').insert({user_id:user.id,storage_path:path,kind:r.kind,duration_s:m.dur,sample_rate:Math.round(m.sr),
    peak_db:m.peak,noise_floor_db:m.floor,clipping_pct:m.clipPct,quality_score:m.score});
  if(ins.error){await sb.storage.from('recordings').remove([path]);say('Saved file but not its record: '+ins.error.message);return;}
  say('Uploaded.');refresh();
}
async function play(r){
  const {data,error}=await sb.storage.from('recordings').createSignedUrl(r.storage_path,300);
  if(error){say(error.message);return;}new Audio(data.signedUrl).play();
}
async function del(r){
  if(!confirm('Delete this recording from the cloud?'))return;
  const s=await sb.storage.from('recordings').remove([r.storage_path]);if(s.error){say(s.error.message);return;}
  const d=await sb.from('voice_recordings').delete().eq('id',r.id);if(d.error){say(d.error.message);return;}
  refresh();
}
</script></body></html>
